<section class="how-it-works">
  <div class="how-it-works__container">
    <h2 class="how-it-works__heading">Как составляются справочники</h2>
    <p class="how-it-works__lead">
      Никаких мифов и завышенных обещаний: маршруты по картам + буфер на пробки + честные риски.
    </p>

    <div class="how-it-works__grid">
      @for (card of cards(); track card.id) {
        <article class="how-it-works__card ag-slide-up ag-hover-lift" [class]="card.delayClass">
          <div class="how-it-works__icon" aria-hidden="true">
            @switch (card.iconType) {
              @case ('map') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                  <line x1="8" y1="2" x2="8" y2="18"></line>
                  <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
              }
              @case ('clock') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              }
              @case ('alert') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
              }
            }
          </div>
          <h3 class="how-it-works__card-title">{{ card.title }}</h3>
          <p class="how-it-works__card-text">{{ card.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
